
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortexiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cortexiq
      POSTGRES_PASSWORD: cortexiq_dev_password
      POSTGRES_DB: cortexiq

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - cortexiq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexiq -d cortexiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cortexiq_postgres_data:
